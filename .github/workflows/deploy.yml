# WARNING: This workflow publishes a FRONTEND-ONLY copy of the site to GitHub
# Pages. Pages cannot run the Express backend, so /api/* (including Turnstile
# verification, login, and orders) returns 404 there and users can never sign
# in. The supported host is Vercel (see VERCEL_DEPLOYMENT.md). This workflow is
# therefore manual-only (workflow_dispatch); it does not run on push to main.
name: Deploy Vite site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # VITE_* values come from repository Variables (Settings → Variables).
      # Without them the published site cannot authenticate: Supabase calls
      # fail and /api/* still has no backend on Pages (set VITE_API_BASE_URL
      # to a separately deployed HTTPS backend and allow this Pages origin in
      # that backend's FRONTEND_ORIGINS).
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
